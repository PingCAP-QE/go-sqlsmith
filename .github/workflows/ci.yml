name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  integration-test:
    name: go-sqlsmith (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mysql: ['5.7', '8.4']
    env:
      SQLSMITH_TEST_DB: sqlsmith_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Start isolated MySQL with a schema-scoped account
        env:
          MYSQL_VERSION: ${{ matrix.mysql }}
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "SQLSMITH_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name sqlsmith-ci -p 127.0.0.1:3306:3306 \
            -e MYSQL_RANDOM_ROOT_PASSWORD=yes \
            -e MYSQL_DATABASE="$SQLSMITH_TEST_DB" \
            -e MYSQL_USER=sqlsmith -e MYSQL_PASSWORD="$password" \
            "mysql:$MYSQL_VERSION"
          for i in {1..60}; do
            if docker exec -e MYSQL_PWD="$password" sqlsmith-ci \
              mysql -usqlsmith -e 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'MySQL did not become ready' >&2
          exit 1

      - name: Unit, security integration and race tests
        run: go test -race ./...

      - name: Build
        run: make

      - name: Run integration binary against the disposable schema
        run: make integration-test TEST_FLAGS='-host 127.0.0.1 -port 3306 -user sqlsmith -db sqlsmith_ci -clear'

      - name: Stop isolated MySQL
        if: always()
        run: docker rm -f sqlsmith-ci || true
